---
# Mrezna politika kao podaci; sablon roles/firewall/templates/ruo.nft.j2 ih
# prevodi u nftables pravila. Mijenja se ovdje, ne u pravilima.

# Uplink se otkriva automatski: sucelje kroz koje host ima zadanu rutu.
fw_uplink: "{{ ansible_default_ipv4.interface }}"

# podmreze segmenata generise terraform/vm (ansible/group_vars/all/terraform.yml)
fw_segmenti: "{{ tf_subnets }}"

# internet -> segment
fw_javno:
  - { do: web, portovi: [80] }

# segment -> segment (slojevi: web -> app -> db, svi -> dns)
fw_pravila:
  - { od: web, do: app, portovi: [8080] }
  - { od: app, do: db, portovi: [3306] }
  - { od: web, do: dns, proto: udp, portovi: [53] }
  - { od: web, do: dns, proto: tcp, portovi: [53] }
  - { od: app, do: dns, proto: udp, portovi: [53] }
  - { od: app, do: dns, proto: tcp, portovi: [53] }
  - { od: db, do: dns, proto: udp, portovi: [53] }
  - { od: db, do: dns, proto: tcp, portovi: [53] }

fw_dest: /etc/nftables.d/ruo.nft
