---
# FAZA 2A (DO-6): Terraform generise inventar, Ansible provjerava vezu.
# Terraform generise i ansible/group_vars/all/terraform.yml (`make infra`); bez
# njega nema podmreza za vatrozid ni DNS zone, pa se prekida odmah s porukom.
- name: Provjeri generisane Terraform varijable
  hosts: rtr
  gather_facts: false

  tasks:
    - name: Provjeri da su podmreze, adrese i zona generisane
      ansible.builtin.assert:
        that:
          - tf_subnets is defined
          - tf_ips is defined
          - dns_zone is defined
          - dns_ttl is defined
        fail_msg: >-
          Nema ansible/group_vars/all/terraform.yml. Pokreni `make infra`
          (Terraform generise podmreze, adrese, zonu i TTL) pa ponovi `make config`.
        quiet: true

- name: Priprema i provjera veze za sve virtuelne mašine
  hosts: web:app:db:dns
  become: true
  gather_facts: false

  pre_tasks:
    - name: Čekaj da SSH veza postane dostupna
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Čekaj da cloud-init završi bootstrap
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Prikupi činjenice o sistemu (setup)
      ansible.builtin.setup:

# Redoslijed: vatrozid prvo zatvori sve osim propisanih tokova, pa se izlaz
# privremeno otvori za instalacije (DNS, Docker) i na kraju ponovo zatvori
# ucitavanjem istih pravila iz datoteke. Otvaranje i zatvaranje neto ne mijenjaju
# stanje, pa nisu `changed`. Ako izvrsavanje pukne prije zatvaranja, izlaz ostaje
# otvoren do sljedeceg `make config` (ili reboota hosta, ruo-firewall.service);
# `make test` (isolation) to otkriva.
- name: Vatrozid hosta iz podataka
  hosts: rtr
  become: true
  gather_facts: true
  roles:
    - firewall

- name: Privremeno otvori izlaz na internet za instalacije
  hosts: rtr
  become: true
  gather_facts: true
  tasks:
    - name: Dozvoli izlaz segmentima projekta (samo u zivim pravilima)
      ansible.builtin.command: >-
        nft insert rule ip ruo forward ip saddr {{ fw_mreza }}
        oifname "{{ fw_uplink }}" accept
      changed_when: false

- name: DNS server
  hosts: dns
  become: true
  roles:
    - dns

# Docker se instalira dok je izlaz privremeno otvoren; dns je vec spreman,
# pa apt na web/app/db moze razrijesiti imena.
- name: Docker na web, app i db
  hosts: web:app:db
  become: true
  roles:
    - docker

- name: Zatvori izlaz na internet
  hosts: rtr
  become: true
  gather_facts: true
  tasks:
    - name: Ponovo ucitaj pravila iz datoteke
      ansible.builtin.command: "nft -f {{ fw_dest }}"
      changed_when: false
