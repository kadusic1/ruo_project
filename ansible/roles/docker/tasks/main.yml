---
# apt s `name` prijavljuje promjenu samo pri instalaciji, ne pri osvjezavanju kesa
- name: Instaliraj Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ukljuci docker servis
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Dodaj korisnika u grupu docker
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Provjeri docker compose
  ansible.builtin.command: docker compose version
  changed_when: false
