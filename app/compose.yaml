services:
  db:
    image: mariadb:11.4
    profiles: ["db", "all"]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-REMOVED}
      MARIADB_DATABASE: ${DB_NAME:-invoices}
      MARIADB_USER: ${DB_USER:-invoices}
      MARIADB_PASSWORD: ${DB_PASSWORD:-REMOVED}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    image: ruo/backend:1.0
    profiles: ["app", "all"]
    restart: unless-stopped
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: "*"
      DSN: "${DB_USER:-invoices}:${DB_PASSWORD:-REMOVED}@tcp(${DB_HOST:-db}:3306)/${DB_NAME:-invoices}?parseTime=true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
        required: false

  frontend:
    build: ./frontend
    image: ruo/frontend:1.0
    profiles: ["web", "all"]
    restart: unless-stopped
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://backend:8080}"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
        required: false

volumes:
  db_data:
