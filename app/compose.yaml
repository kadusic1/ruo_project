# Opis slojeva. Svaki VM pokrece samo svoj profil (rola app), a sve
# varijable (DNS imena, generisane lozinke) su u .env koji pravi Ansible
# (roles/app/templates/env.j2), samo one koje tom sloju trebaju.
# Slike gradi host (`docker compose --profile app --profile web build` u
# ansible/deploy.yml); imena moraju odgovarati app_images u
# ansible/group_vars/all/vars.yml.

# .env postoji samo na VM-ovima; na hostu (build) nije potreban
x-env: &env
  path: .env
  required: false

services:
  db:
    image: mariadb:11.4
    profiles: ["db"]
    restart: unless-stopped
    # mreza VM-a, bez objavljenog porta; do 3306 smije samo app segment
    # (vatrozid na hostu)
    network_mode: host
    env_file: [*env]
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    image: ruo/backend:1.0
    profiles: ["app"]
    restart: unless-stopped
    env_file: [*env]
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: "*"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    image: ruo/frontend:1.0
    profiles: ["web"]
    restart: unless-stopped
    env_file: [*env]
    ports:
      - "80:80"

volumes:
  db_data:
